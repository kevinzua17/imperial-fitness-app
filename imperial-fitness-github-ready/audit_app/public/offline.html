<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <title>Imperial Fitness | Sin conexión</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at top left, rgba(220, 38, 38, 0.22), transparent 32%),
          linear-gradient(135deg, #050505 0%, #111 50%, #020202 100%);
        color: #f5f5f5;
        font-family: Montserrat, Arial, sans-serif;
        padding: 24px;
      }
      .panel {
        width: min(460px, 100%);
        border: 1px solid #262626;
        border-radius: 24px;
        background: rgba(10, 10, 10, 0.82);
        box-shadow: 0 30px 90px rgba(0,0,0,.6);
        padding: 28px;
        text-align: center;
      }
      img {
        width: 112px;
        height: 112px;
        object-fit: contain;
        background: #fff;
        border-radius: 18px;
        padding: 8px;
        margin-bottom: 18px;
      }
      h1 { margin: 0 0 10px; font-size: 24px; letter-spacing: -0.02em; }
      p { margin: 0; color: #a3a3a3; line-height: 1.6; font-size: 14px; }
      button {
        margin-top: 22px;
        border: 0;
        border-radius: 14px;
        background: #dc2626;
        color: white;
        font-weight: 800;
        padding: 12px 18px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <img src="/logo-imperial-fitness.png" alt="Imperial Fitness" />
      <h1>Sin conexión</h1>
      <p>Tu app Imperial Fitness está instalada, pero necesitas conexión para sincronizar rutinas, dietas, fotos y mensajes con tu entrenador.</p>
      <button onclick="window.location.reload()">Reintentar</button>
    </main>
  </body>
</html>
