services:
  - type: web
    name: imperial-fitness-api
    env: python
    rootDir: .
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://imperialfitnesgym.com.co,https://www.imperialfitnesgym.com.co
      - key: TRUSTED_HOSTS
        value: imperialfitnesgym.com.co,www.imperialfitnesgym.com.co,imperial-fitness-api.onrender.com
      - key: RATE_LIMIT_ENABLED
        value: true
      - key: RATE_LIMIT_PER_MINUTE
        value: 90
      - key: SLOWAPI_ENABLED
        value: true
      - key: STORAGE_MODE
        value: cloudinary
      - key: AI_MODE
        value: local_rules
      - key: ASYNC_JOBS_ENABLED
        value: true
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: REDIS_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: ENABLE_HSTS
        value: true
      - key: METRICS_ENABLED
        value: true